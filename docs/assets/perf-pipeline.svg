<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect width="880" height="330" fill="#FFFFFF"/>
  <text x="440" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">List refresh pipeline: from identity-equality diff to background differ</text>
  <text x="440" y="52" text-anchor="middle" font-size="11" fill="#475569">five optimization rounds — the last two are mechanism-level, not micro-tuning</text>

  <!-- lane labels -->
  <text x="24" y="94" font-size="12" font-weight="700" fill="#DC2626">Before</text>
  <text x="24" y="196" font-size="12" font-weight="700" fill="#059669">After</text>

  <!-- Before lane -->
  <text x="80" y="82" font-size="10" fill="#94A3B8">main thread ─────────────────────────────────────────────────────────►</text>
  <rect x="80" y="90" width="120" height="30" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
  <text x="140" y="109" text-anchor="middle" font-size="10.5" fill="#991B1B">load 10k items</text>
  <rect x="212" y="90" width="170" height="30" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
  <text x="297" y="109" text-anchor="middle" font-size="10.5" fill="#991B1B">regex recompiled per entry</text>
  <rect x="394" y="90" width="190" height="30" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
  <text x="489" y="109" text-anchor="middle" font-size="10.5" fill="#991B1B">DiffUtil on main thread</text>
  <rect x="596" y="90" width="200" height="30" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
  <text x="696" y="109" text-anchor="middle" font-size="10.5" fill="#991B1B">full rebind: equals is identity</text>

  <!-- After lane -->
  <text x="80" y="184" font-size="10" fill="#94A3B8">main / worker ───────────────────────────────────────────────────────►</text>
  <rect x="80" y="192" width="120" height="30" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1"/>
  <text x="140" y="211" text-anchor="middle" font-size="10.5" fill="#065F46">load (lazy regex)</text>
  <rect x="212" y="192" width="240" height="30" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="332" y="211" text-anchor="middle" font-size="10.5" fill="#1E40AF">AsyncListDiffer on worker thread</text>
  <rect x="464" y="192" width="150" height="30" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1"/>
  <text x="539" y="211" text-anchor="middle" font-size="10.5" fill="#065F46">value equals → skip</text>
  <rect x="626" y="192" width="170" height="30" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1"/>
  <text x="711" y="211" text-anchor="middle" font-size="10.5" fill="#065F46">payload rebind, only deltas</text>

  <!-- bottom note -->
  <rect x="60" y="250" width="760" height="60" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="440" y="274" text-anchor="middle" font-size="11.5" fill="#475569">Key fix: hand-written equals/hashCode for Linux/Archive/Document/Smb attributes + collation keys —</text>
  <text x="440" y="293" text-anchor="middle" font-size="11.5" fill="#475569">DiffUtil had <tspan font-style="italic">never actually worked</tspan> on the local file system before round 4 (identity comparison everywhere).</text>
</svg>
