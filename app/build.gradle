apply plugin: 'com.android.application'
apply plugin: 'kotlin-parcelize'
// Consumes the baseline profile produced by :benchmark (see its generateBaselineProfile task)
// and packages it into the APK for install-time AOT compilation of hot startup/list paths.
apply plugin: 'androidx.baselineprofile'

// CI explicitly opts out of signing; do not load credentials or prompt for them in that mode.
// Normal builds retain the existing signing.gradle behavior.
def unsignedRelease = providers.gradleProperty('unsignedRelease').map { it.toBoolean() }.getOrElse(false)
if (!unsignedRelease) {
    apply from: '../signing.gradle'
}

android {
    namespace 'me.zhanghai.android.files'
    buildToolsVersion = '37.0.0'
    compileSdk = 36
    ndkVersion '28.1.13356709'
    defaultConfig {
        applicationId 'me.zhanghai.android.nexfiles'
        minSdk 23
        // Ship only the locales this project actually maintains: the store listings
        // (fastlane/metadata) and READMEs exist for English and Chinese only, while the other
        // 27 locales are stale upstream Material Files snapshots at <=61% string coverage that
        // already show a half-English UI for everything this fork added. resources.arsc must be
        // stored uncompressed in the APK (targetSdk 30+), so those locales cost their full
        // ~1.3 MB of download; measured en-only vs all-locales arsc: 0.73 MB vs 2.19 MB.
        // Add a qualifier back here (e.g. 'de') to restore a locale.
        resourceConfigurations += ['en', 'zh-rCN', 'zh-rTW']
        // Not supporting foreground service timeout yet.
        //noinspection OldTargetApi
        targetSdk 34
        versionCode 39
        versionName '1.7.4'
        resValue 'string', 'app_version', versionName + ' (' + versionCode + ')'
        buildConfigField 'String', 'FILE_PROVIDIER_AUTHORITY', 'APPLICATION_ID + ".file_provider"'
        resValue 'string', 'app_provider_authority', applicationId + '.app_provider'
        resValue 'string', 'file_provider_authority', applicationId + '.file_provider'
        externalNativeBuild {
            cmake {
                // lsplant is C++ and needs a C++ STL; the existing C-only libs (hiddenapi,
                // syscall, terminal) are unaffected by switching from `none` to c++_static.
                arguments '-DANDROID_STL=c++_static'
                // shadowhook ships native libraries for ARM only, so x86 emulator builds
                // can't link the hook bridge.
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }
    buildFeatures {
        aidl true
        buildConfig true
        resValues true
        viewBinding true
        // prefab exposes lsplant's native headers + .so to our own CMake-built hook bridge.
        prefab true
    }
    androidResources {
        generateLocaleConfig true
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
        }
    }
    lint {
        // For "Invalid package reference in library; not included in Android: javax.security.sasl.
        // Referenced from org.apache.mina.proxy.ProxyAuthException."
        warning 'InvalidPackage', 'MissingTranslation'
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (!unsignedRelease) {
                signingConfig signingConfigs.release
            }
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            // Our own JNI libs (syscall, hiddenapi, terminal, nexhook) are ARM-only per the
            // abiFilters above, but the prebuilt libarchive/libselinux AARs also ship x86/x86_64.
            // Keeping those actively breaks x86_64 emulators instead of helping them: the
            // installer sees x86_64 libs, picks x86_64 as the primary ABI and extracts only
            // those, so ARM-only libsyscall never gets installed and the local file provider
            // fails to load. With no x86 libs in the APK the emulator falls back to arm64-v8a
            // through ARM translation and every library stays consistent. Also saves ~4.7 MB
            // uncompressed (~2 MB compressed) on real devices, which are all ARM.
            excludes += ['lib/x86/**', 'lib/x86_64/**']
        }
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'org/bouncycastle/pqc/crypto/picnic/*',
                    // German variants of Bouncy Castle's CertPathReviewer message bundle;
                    // ResourceBundle falls back to the shipped English base when absent.
                    'org/bouncycastle/pkix/CertPathReviewerMessages_de.properties',
                    'org/bouncycastle/x509/CertPathReviewerMessages_de.properties'
            ]
        }
    }
    bundle {
        language {
            enableSplit = false
        }
    }
    // Opt-in per-ABI packaging for distribution runs:
    //   ./gradlew -PenableAbiSplits assembleRelease
    // emits one APK per ABI instead of a single universal one, so an arm64 device (every
    // real device this app targets — the hook/terminal native stack is ARM-only anyway)
    // no longer downloads the armeabi-v7a libraries. Default builds stay universal so CI
    // artifacts and F-Droid keep seeing exactly one APK per variant.
    if (project.hasProperty('enableAbiSplits')) {
        splits {
            abi {
                enable true
                reset()
                include 'armeabi-v7a', 'arm64-v8a'
                universalApk false
            }
        }
    }
}

repositories {
    maven {
        url 'https://jitpack.io'
    }
}
dependencies {
    // Embeds the baseline profile that :benchmark records on a device (generateBaselineProfile).
    baselineProfile project(':benchmark')
    // We need https://github.com/bitfireAT/dav4jvm/commit/c1bc14348831bcdb00f3a6eec4859b81c7dc3728
    implementation(libs.dav4jvm) {
        exclude group: 'org.ogce', module: 'xpp3'
    }
    implementation libs.photoview
    implementation libs.libsu.service
    // dexlib2 for the DEX editor/viewer: parses DEX bytecode into a mutable object model and
    // writes it back with checksums/signature recomputed. BSD-licensed, pure Java, the same
    // library smali/baksmali are built on. Published on Maven Central as org.smali:dexlib2, so
    // we use that (no JitPack round-trip). Guava comes in transitively and is required by
    // dexlib2's immutable collections; we don't exclude it.
    implementation libs.dexlib2
    // smali + baksmali for the smali source-level editor: baksmali disassembles a ClassDef into
    // human-readable smali text, and smali assembles edited text back into a ClassDef. Same
    // 2.5.2 version as dexlib2 to guarantee API compatibility; both are on Maven Central.
    implementation libs.baksmali
    implementation(libs.smali) {
        // smali's POM drags in the full ANTLR 3 tool (org.antlr:antlr), whose codegen templates
        // (.stg grammars for C/C++/C#/ObjC/Delphi/Python...) and tool classes are only needed to
        // *generate* parsers from grammars. The parser smali ships is pre-generated and uses only
        // org.antlr:antlr-runtime, which smali also depends on directly and which survives this
        // exclusion. Dropping the tool removes ~1.3 MB of dead .stg resources that R8 cannot strip
        // (they are jar resources, not classes) plus thousands of dead tool classes.
        exclude group: 'org.antlr', module: 'antlr'
        // Same story for StringTemplate: the ANTLR tool uses it to render generated code, the
        // pre-generated smali parser never touches it at runtime.
        exclude group: 'org.antlr', module: 'stringtemplate'
    }
    // smali's POM declares antlr-runtime at runtime scope only; the compile classpath used to get
    // org.antlr.runtime.tree.TreeParser (supertype of SmaliTreeWalker, which DexSmaliBridge
    // touches) from the full tool jar above. Declare it explicitly so compilation still sees it.
    implementation libs.antlr.runtime
    // lsplant (LSPosed's ART method-hook core) for the runtime hook feature. LGPL-3.0, the
    // library that actually rewrites ArtMethod entry points to install Java method hooks. We
    // pull the standalone variant — it is a pure-native prefab library (C++ header + .so), so
    // our own C++ JNI bridge links against it directly. The inline-hooker backend (the one
    // piece lsplant delegates to its host) is provided by our nexhook bridge.
    implementation libs.lsplant.standalone
    // ShadowHook (ByteDance's production-grade inline hook library) as the inline-hook backend
    // for lsplant. lsplant delegates native code patching to its host; ShadowHook implements
    // that with a battle-tested arm64/arm32 trampoline installer. MIT-licensed, prefab, so our
    // nexhook.cpp links it directly. This closes the one gap that made lsplant::Init fail.
    // 2.0.1 ships AAR metadata requiring minCompileSdk 37 (AGP 9.1.0 caps at 36); 2.0.0 has
    // minCompileSdk 1 and the same inline-hook backend API we use.
    implementation libs.shadowhook
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    coreLibraryDesugaring libs.desugar.jdk.libs

    // kotlinx-coroutines-android depends on kotlin-stdlib-jdk8
    implementation libs.kotlin.stdlib.jdk8
    implementation libs.kotlinx.coroutines.android
    implementation libs.kotlinx.coroutines.core

    implementation libs.androidx.activity.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.core.ktx
    implementation libs.androidx.drawerlayout
    implementation libs.androidx.exifinterface
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.lifecycle.common.java8
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.lifecycle.process
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.preference.ktx
    implementation libs.androidx.recyclerview
    implementation libs.androidx.swiperefreshlayout
    implementation libs.material

    implementation libs.androidsvg.aar
    implementation libs.subsampling.scale.image.view
    implementation libs.drakeet.drawer
    implementation libs.materialshadowninepatch
    implementation libs.advrecyclerview
    //noinspection NewerVersionAvailable
    implementation(libs.smbj) {
        // org.bouncycastle:bcprov-jdk15on uses bytecode version unsupported by Jetifier, so use
        // org.bouncycastle:bcprov-jdk15to18 instead.
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
    }
    implementation libs.bouncycastle.bcprov.jdk15to18
    implementation(libs.sshj) {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
        exclude group: 'org.bouncycastle', module: 'bcpkix-jdk18on'
    }
    implementation libs.bouncycastle.bcpkix.jdk15to18
    implementation libs.speed.dial
    implementation(libs.dcerpc) {
        // SMBJ-RPC depends on the JRE flavor of Guava which targets Java 8.
        exclude group: 'com.google.guava', module: 'guava'
        // Prevent promotion of SMBJ version to 0.12.2.
        exclude group: 'com.hierynomus', module: 'smbj'
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
    }
    implementation libs.guava
    implementation libs.listenablefuture
    implementation libs.preferencex
    implementation libs.commons.net
    //noinspection NewerVersionAvailable
    implementation libs.licensesdialog
    implementation libs.insetter.ktx
    implementation libs.simplemenu.preference
    implementation libs.shizuku.api
    implementation(libs.jcifs.ng) {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
    }
    implementation platform(libs.coil.bom)
    implementation libs.coil
    implementation libs.coil.gif
    implementation libs.coil.svg
    implementation libs.coil.video
    implementation libs.appiconloader
    implementation libs.fastscroll
    implementation libs.foregroundcompat
    implementation libs.libarchive
    implementation libs.libselinux
    implementation libs.retrofile
    implementation libs.systemuihelper
    implementation libs.ftpserver.core
    // tar.gz extraction for the terminal rootfs downloads. Apache 2.0, handles pax/GNU/ustar
    // variants that hand-writing a tar reader would get wrong on real-world rootfs archives.
    implementation libs.commons.compress
    // XZ for Java, the decompressor commons-compress delegates to for .tar.xz streams. It is an
    // optional compileOnly dependency of commons-compress, so without it here the release R8
    // build fails on the missing org.tukaani.xz classes — and at runtime the Debian rootfs
    // (a .tar.xz) would crash RootfsManager with NoClassDefFoundError. Public domain, pure Java.
    implementation libs.xz
    // Media3 (ExoPlayer successor) for the built-in media viewer. Replaces the system VideoView:
    // better format coverage, real error handling, and proper lifecycle/resume support. We pull
    // core + UI (PlayerView with built-in controls); FFmpeg extension can be added later for
    // formats the platform decoders don't cover.
    implementation libs.androidx.media3.exoplayer
    implementation libs.androidx.media3.ui
    // Embedded HTTP server backing the WebDAV server feature. Lightweight (~50KB), no transitive
    // deps, and intentionally used without websockets/main module.
    implementation libs.nanohttpd
    // This is a dependency of org.apache.ftpserver:ftpserver-core but org.apache.mina:mina-core
    // 2.1.4+ became incompatible before API 24 due to dependency on StandardSocketOptions
    // (DIRMINA-1123) and NetworkChannel.supportedOptions() (DIRMINA-1130).
    // The catalog retains the strict 2.1.3 constraint (not just a preferred version).
    implementation libs.mina.core
    // Also a dependency of jCIFS-NG.
    implementation libs.slf4j.android

    // Pure JVM unit tests (JUnit 4).
    testImplementation libs.junit4
}
