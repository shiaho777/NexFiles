name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        submodules: true
        persist-credentials: false
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Run JVM unit tests
      run: ./gradlew -PunsignedRelease=true :app:testDebugUnitTest --stacktrace
    - name: Run full lint
      # Run even when tests fail, and keep legacy lint failures visible (no blanket suppression).
      if: ${{ !cancelled() }}
      run: ./gradlew -PunsignedRelease=true lint --stacktrace
    - name: Assemble debug APK
      if: ${{ !cancelled() }}
      run: ./gradlew -PunsignedRelease=true :app:assembleDebug --stacktrace
    - name: Upload test and lint reports
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: test-and-lint-reports
        path: |
          app/build/reports/tests/
          app/build/test-results/
          app/build/reports/lint-results*
          benchmark/build/reports/lint-results*
        retention-days: 14
        if-no-files-found: warn
    - name: Upload debug APK
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 10
        if-no-files-found: error

  release:
    # Exercise R8/resource shrinking without loading signing.gradle or private credentials.
    # The unsigned APK is a CI artifact only; this job does not publish a GitHub/store release.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        submodules: true
        persist-credentials: false
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Assemble unsigned release APK
      run: ./gradlew -PunsignedRelease=true :app:assembleRelease --stacktrace
    - name: Upload release mapping
      # Preserve any R8 output even if a later release task fails.
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: release-mapping-${{ github.sha }}
        path: app/build/outputs/mapping/release/
        retention-days: 30
        if-no-files-found: error
    - name: Upload unsigned release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-unsigned-${{ github.sha }}
        path: app/build/outputs/apk/release/*-unsigned.apk
        retention-days: 30
        if-no-files-found: error

  dependency-review:
    # Public repositories support dependency review when Dependency Graph is enabled.
    # Catalogs are not a prerequisite; review coverage depends on GitHub's dependency graph.
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Review dependency changes
      uses: actions/dependency-review-action@v5
      with:
        fail-on-severity: high
