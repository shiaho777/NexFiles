// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Keep the original plugin coordinates and application mechanism, with catalog versions.
        classpath libs.android.gradle.plugin
        classpath libs.kotlin.gradle.plugin
        // Produces/consumes baseline profiles: the :benchmark module records ART execution on
        // device, the app module embeds the result as assets/dexopt/baseline.prof.
        classpath libs.baselineprofile.gradle.plugin
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
